<script>
(function () {
  function go(path, target) {
    if (target === "_blank") {
      window.open(path, "_blank", "noopener,noreferrer");
      return;
    }
    window.location.href = path;
  }

  var typedCommand = "";
  window.addEventListener("keydown", function (event) {
    var target = event.target;
    var tag = target && target.tagName ? target.tagName.toLowerCase() : "";
    if (tag === "input" || tag === "textarea" || tag === "select" || (target && target.isContentEditable)) return;
    if (!event.key || event.key.length !== 1) return;
    typedCommand = (typedCommand + event.key).toLocaleLowerCase("tr-TR").slice(-8);
    if (typedCommand.endsWith("adm")) {
      typedCommand = "";
      go("/admin-login");
    } else if (typedCommand.endsWith("frm")) {
      typedCommand = "";
      go("/firm-login");
    } else if (typedCommand.endsWith("sln")) {
      typedCommand = "";
      go("/login");
    }
  }, true);

  document.addEventListener("click", function (event) {
    var target = event.target && event.target.closest ? event.target.closest("a,button") : null;
    if (!target) return;
    var text = (target.textContent || "").replace(/\s+/g, " ").trim().toLocaleLowerCase("tr-TR");
    if (text === "fiyatlar" || text.includes("fiyatlar")) {
      event.preventDefault();
      event.stopImmediatePropagation();
      return go("/fiyatlar");
    }
    if (
      text.includes("giriş yap") ||
      text.includes("giris yap") ||
      text.includes("hemen başla") ||
      text.includes("hemen basla") ||
      text.includes("şimdi al") ||
      text.includes("simdi al") ||
      text.includes("admin girişi") ||
      text.includes("admin girisi") ||
      text.includes("firma girişi") ||
      text.includes("firma girisi")
    ) {
      event.preventDefault();
      event.stopImmediatePropagation();
      if (text.includes("admin")) return go("/admin-login");
      if (text.includes("firma")) return go("/firm-login");
      return go("/login", "_blank");
    }
  }, true);
})();
</script>
